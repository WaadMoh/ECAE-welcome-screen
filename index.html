<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ECAE Welcome Screen</title>

    <link rel="stylesheet" href="style.css">

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js">
    </script>

    <script defer src="script.js"></script>
</head>

<body>

    <div class="overlay">

        <div class="card">

            <img
                src="logo.png"
                class="logo"
                alt="ECAE Logo"
            >

            <h1>
                Emirates College for Advanced Education
            </h1>

            <h2>
                كلية الإمارات للتطوير التربوي
            </h2>

            <div id="status">
                Preparing camera...
            </div>

            <video
                id="video"
                autoplay
                playsinline
                muted>
            </video>

            <div id="message">
                Loading face detection...
            </div>

        </div>

    </div>

</body>

</html>
