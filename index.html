<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECAE Welcome Screen</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>

<body>

<div class="overlay">

    <div class="card">

        <img src="logo.png" class="logo" alt="ECAE Logo">

        <h1>Emirates College for Advanced Education</h1>

        <h2>كلية الإمارات للتطوير التربوي</h2>

        <div id="status">
            Loading camera...
        </div>

        <div id="message"></div>

        <button id="startBtn">
            Start Experience
        </button>

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
